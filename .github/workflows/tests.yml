name: tests

permissions:
  contents: read

# The suite is the merge gate.
#
# Deliberately unfiltered: every other workflow here is path-scoped, and the only
# vitest call in CI (telemetry-contract.yml) names six files. A pull request that
# touched none of them ran no tests at all. See bead xtrm-wiy5n.4.26.

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Pinned so a bun release cannot break every PR at once. Bump in a
          # deliberate PR alongside .github/workflows/telemetry-contract.yml — keep both in lockstep.
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run lint
      - name: Run test suite
        run: bun run test
      # ponytail: the quarantined lane is known-red by construction, so this job
      # reports its size instead of running it. Un-quarantining is bead
      # xtrm-wiy5n.4.11; a green quarantined lane means the list is empty and this
      # step reports 0.
      - name: Report quarantine count
        if: always()
        run: |
          # grep -c exits 1 on zero matches and run steps use errexit, so an empty
          # quarantine list would fail the job instead of reporting 0.
          COUNT=$(grep -cE "^\s+'tests/.*', // ISSUE:" vitest.config.ts || true)
          echo "Quarantined suites excluded from this job: **$COUNT** (bead xtrm-wiy5n.4.11)" >> "$GITHUB_STEP_SUMMARY"
