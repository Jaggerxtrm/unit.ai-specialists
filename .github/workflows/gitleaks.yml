name: Gitleaks

# Backstop scan for committed secrets. PRs scan only the PR range; push/schedule
# scan full history against a redacted baseline of acknowledged historical debt.
# GitHub push protection is the primary gate for new secrets.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * 1"  # Monday 06:00 UTC weekly

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks scan
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON(vars.CI_RUNNER || '["self-hosted","linux","mercury-lite","specialists"]') }}
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0  # full history for scheduled deep scans
          persist-credentials: false

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=v8.30.1
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            gitleaks git \
              --log-opts "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
              --redact \
              --config .gitleaks.toml \
              --baseline-path .gitleaks/baseline.json \
              --no-banner \
              --verbose \
              .
          else
            gitleaks git \
              --redact \
              --config .gitleaks.toml \
              --baseline-path .gitleaks/baseline.json \
              --no-banner \
              --verbose \
              .
          fi
